name: Supabase database checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/download/v3.3.0/supabase_3.3.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/supabase.tar.gz"
          echo "8d12731ae522a8f263170ca719b33f163dd05f4365ae6c22b31714dfa1e92b9b  $RUNNER_TEMP/supabase.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/supabase.tar.gz" -C "$RUNNER_TEMP" supabase
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Start disposable local Supabase and apply migrations
        run: supabase start
      - name: Test database policies and transaction rollback
        run: supabase test db
      - name: Test Auth, REST and Storage APIs
        run: python3 scripts/test_supabase_api.py
      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
