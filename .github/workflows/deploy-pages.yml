name: Deploy LostAndFound to Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lost_and_found_app/**"
      - "scripts/build_pages.py"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

concurrency:
  group: lost-and-found-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate public deployment configuration
        run: python3 -c "import sys; sys.path.insert(0, 'scripts'); from build_pages import validate; import os; validate(os.environ['SUPABASE_URL'], os.environ['SUPABASE_ANON_KEY'])"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.29.3"
          cache: true
      - name: Install dependencies
        working-directory: lost_and_found_app
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        working-directory: lost_and_found_app
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: lost_and_found_app
        run: flutter test
      - name: Build for the repository subpath
        run: python3 scripts/build_pages.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: lost_and_found_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
