name: Flutter checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lost_and_found_app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.29.3"
          cache: true
      - name: Check hosted configuration guards
        working-directory: .
        run: python3 scripts/test_pages_config.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze errors and warnings
        run: flutter analyze --no-fatal-infos
      - name: Run regression tests
        run: flutter test
      - name: Compile the Pages build with public fixture configuration
        working-directory: .
        env:
          SUPABASE_URL: https://fixture.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiJ9.eyJyb2xlIjoiYW5vbiJ9.Zml4dHVyZQ
        run: |
          python3 scripts/build_pages.py
          python3 -c "from pathlib import Path; p=Path('lost_and_found_app/build/web'); assert '<base href=\"/LostAndFoundApp/\">' in (p/'index.html').read_text(); assert (p/'flutter_bootstrap.js').exists(); assert (p/'.nojekyll').exists()"

